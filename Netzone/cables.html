<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الكابلات - NetZone</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>.cart-badge { background-color: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 50%; }</style>
</head>
<body onload="updateBadge()">

 <!-- الهيدر الموحد لجميع الصفحات -->
<header>
    <div class="logo">NetZone <span>مستلزمات الشبكات</span></div>
    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="cart.html">🛒 السلة <span id="header-cart-count" class="cart-badge">0</span></a>
        <a href="faq.html">الأسئلة الشائعة</a>
        <a href="contact.html">تواصل معنا</a>
        <a href="login.html">تسجيل الدخول</a>

    </nav>
</header>


    <div class="container">
        <h1 class="section-title">قسم الكابلات</h1>

        <div class="grid">
            <div class="card">
                <img src="imge/cab3.png" alt="كابل">
                <h3>كابل Cat6 UTP</h3>
                <p>المنافذ: RJ45 / الطول: 10 متر</p>
                <div class="price">50 ريال</div>
                <button class="btn-main" onclick="addToCart('كابل Cat6 UTP', 50, 'images/cable1.jpg')">إضافة إلى السلة</button>
            </div>
            <div class="card">
                <img src="imge/cab2.png" alt="كابل">
                <h3>لفافة كابل Cat7 SFTP</h3>
                <p>الطول: 305 متر (بدون مقابس)</p>
                <div class="price">650 ريال</div>
                <button class="btn-main" onclick="addToCart('لفافة كابل Cat7 SFTP', 650, 'images/cable2.jpg')">إضافة إلى السلة</button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('netzone_cart')) || [];
        function updateBadge() {
            document.getElementById('header-cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0);
        }
        function addToCart(name, price, img) {
            let item = cart.find(i => i.name === name);
            if (item) item.qty++; else cart.push({ name: name, price: price, image: img, qty: 1 });
            localStorage.setItem('netzone_cart', JSON.stringify(cart));
            updateBadge();
            alert('تمت إضافة ' + name + ' إلى السلة!');
        }
    </script>
     <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - NetZone مستلزمات الشبكات</p>
    </footer>
</body>
</html>
