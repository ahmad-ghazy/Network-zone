<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - NetZone</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- الهيدر الموحد لجميع الصفحات -->
    <header>
        <div class="logo">NetZone <span>مستلزمات الشبكات</span></div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات</a>
            <a href="cart.html">🛒 السلة <span id="header-cart-count" class="cart-badge">0</span></a>
            <a href="faq.html">الأسئلة الشائعة</a>
            <a href="contact.html">تواصل معنا</a>
            <a href="login.html">تسجيل الدخول</a>
        </nav>
    </header>

    <!-- محتوى صفحة تواصل معنا (مستخدماً كلاسات الـ CSS الخاصة بك) -->
    <div class="container">
        <h1 class="section-title">📞 تواصل معنا</h1>

        <div class="form-card" style="max-width: 100%;">
            <p style="margin-bottom: 20px; font-size: 14px; color: #4b5563; line-height: 1.6;">
                نحن هنا لمساعدتك في كل ما يتعلق بمستلزمات الشبكات. يمكنك إرسال استفسارك وسنقوم بالرد عليك في أقرب وقت ممكن.
            </p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" name="name" placeholder="أدخل اسمك الكامل" required>
                </div>
                
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" name="email" placeholder="example@domain.com" required>
                </div>

                <div class="form-group">
                    <label>رسالتك:</label>
                    <textarea name="message" placeholder="اكتب استفسارك أو رسالتك هنا..." rows="5" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; font-family: inherit;" required></textarea>
                </div>

                <button type="submit" class="btn-main" style="width: 100%;">إرسال الرسالة</button>
            </form>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - NetZone مستلزمات الشبكات</p>
    </footer>

</body>
</html>
